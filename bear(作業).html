<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CSS 熊本熊</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ddd;
}

.bear{
    position:relative;
    width:320px;
    height:320px;
}

/* 頭 */
.face{
    width:300px;
    height:300px;
    background:#000;
    border-radius:50%;
    position:absolute;
    left:10px;
    top:10px;
}

/* 耳朵 */
.ear{
    width:50px;
    height:50px;
    background:#fff;
    border:10px solid #000;
    border-radius:50%;
    position:absolute;
    top:0;
}
.ear.left{ left:40px; }
.ear.right{ right:40px; }

/* 眼睛 */
.eye{
    width:45px;
    height:45px;
    background:#000;
    border:12px solid #fff;
    border-radius:50%;
    position:absolute;
    top:70px;
}
.eye.left{ left:75px; }
.eye.right{ right:75px; }

/* 臉頰 */
.cheek{
    width:85px;
    height:85px;
    background:red;
    border-radius:50%;
    position:absolute;
    top:120px;
}
.cheek.left{ left:0; }
.cheek.right{ right:0; }

/* 嘴巴白區 */
.mouth-area{
    width:110px;
    height:90px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    left:105px;
    top:130px;
}

/* 鼻子 */
.nose{
    width:30px;
    height:20px;
    background:#000;
    border-radius:50%;
    position:absolute;
    left:145px;
    top:135px;
}

/* 嘴巴 */
.mouth{
    width:70px;
    height:35px;
    background:#000;
    border-radius:50%;
    position:absolute;
    left:125px;
    top:165px;
}

/* 白色V */
.v{
    position:absolute;
    bottom:35px;
    left:100px;
    width:120px;
    height:45px;
}
.v:before,
.v:after{
    content:"";
    position:absolute;
    width:65px;
    height:20px;
    background:#fff;
    top:10px;
}
.v:before{
    left:0;
    transform:rotate(40deg);
}
.v:after{
    right:0;
    transform:rotate(-40deg);
}
</style>
</head>
<body>

<div class="bear">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="face"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="cheek left"></div>
    <div class="cheek right"></div>

    <div class="mouth-area"></div>
    <div class="nose"></div>
    <div class="mouth"></div>

    <div class="v"></div>
</div>

</body>
</html>
